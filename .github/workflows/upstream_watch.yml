name: Upstream dart_libp2p watch

# Weekly check for new upstream dart_libp2p releases. The project depends on
# the ipfs_libp2p fork; when upstream publishes, the fork-merge cadence in
# doc/MAINTAINER_GUIDE.md applies. This workflow opens a tracking issue so the
# review does not rely on someone remembering.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare pub.dev latest against reviewed baseline
        id: check
        run: |
          set -euo pipefail
          BASELINE=$(tr -d '[:space:]' < tool/upstream_dart_libp2p_version.txt)
          LATEST=$(curl -sf https://pub.dev/api/packages/dart_libp2p \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])')
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$BASELINE" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh tracking issue on drift
        if: steps.check.outputs.drift == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const baseline = '${{ steps.check.outputs.baseline }}';
            const title = `Upstream dart_libp2p ${latest} released (baseline ${baseline})`;
            const body = [
              `Upstream \`dart_libp2p\` published **${latest}** on pub.dev;`,
              `the last-reviewed baseline is **${baseline}**.`,
              '',
              'Per `doc/MAINTAINER_GUIDE.md` (ipfs_libp2p fork cadence):',
              '',
              '- [ ] Review the upstream diff at https://github.com/stephanfeb/dart_libp2p',
              '- [ ] Selectively merge relevant fixes into the ipfs_libp2p fork',
              '- [ ] Bump `tool/upstream_dart_libp2p_version.txt` to ' + latest,
              '',
              '_Opened by the upstream watch workflow._',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              per_page: 50,
            });
            const existing = issues.find((i) =>
              i.title.startsWith('Upstream dart_libp2p'),
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still drifted: latest ${latest} vs baseline ${baseline}.\n\n${body}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependencies'],
              });
            }
