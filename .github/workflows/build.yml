name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-dart:
    name: Build Dart Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Compile AOT
        run: dart compile exe example/dart_ipfs_example.dart -o ipfs_node_${{ matrix.os }}

  build-flutter:
    name: Build Flutter Dashboard (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - target: Windows
            os: windows-latest
            command: flutter build windows --debug
          - target: macOS
            os: macos-latest
            command: flutter build macos --debug
          - target: Web
            os: ubuntu-latest
            command: flutter build web --debug

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Install Linux Build Dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev

      - name: Generate Dependencies
        run: |
          cd example/ipfs_dashboard
          flutter pub get

      - name: Test and Analyze flutter_ipfs
        if: matrix.target == 'Linux'
        run: |
          cd packages/flutter_ipfs
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Dashboard
        run: |
          cd example/ipfs_dashboard
          ${{ matrix.command }}
