name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "core-v[0-9]+.[0-9]+.[0-9]+*"
      - "quic-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: 'Target package to publish (core, quic, umbrella, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - quic
          - umbrella
      dry_run:
        description: 'Dry run only (do not actually publish)'
        required: false
        default: false
        type: boolean

jobs:
  release-gate:
    name: Release surface gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Verify release surfaces and tag
        run: |
          TAG_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_ARG="--tag ${GITHUB_REF#refs/tags/}"
          fi
          dart run tool/release_surfaces.dart --check $TAG_ARG

  publish-core:
    name: Publish dart_ipfs_core
    needs: [release-gate]
    if: inputs.target == 'core' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/core-v') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        working-directory: packages/dart_ipfs_core
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: packages/dart_ipfs_core
        run: dart pub get

      - name: Verify formatting and analysis
        working-directory: packages/dart_ipfs_core
        run: |
          dart format --output=none --set-exit-if-changed . || true
          dart analyze --fatal-warnings

      - name: Run pana score check
        working-directory: packages/dart_ipfs_core
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_core
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_core
        run: dart pub publish -f

  publish-quic:
    name: Publish dart_ipfs_quic
    needs: [release-gate, publish-core]
    if: always() && needs.release-gate.result == 'success' && (inputs.target == 'quic' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/quic-v') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        working-directory: packages/dart_ipfs_quic
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: packages/dart_ipfs_quic
        run: dart pub get

      - name: Verify formatting and analysis
        working-directory: packages/dart_ipfs_quic
        run: |
          dart format --output=none --set-exit-if-changed . || true
          dart analyze --fatal-warnings

      - name: Run pana score check
        working-directory: packages/dart_ipfs_quic
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_quic
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_quic
        run: dart pub publish -f

  publish-umbrella:
    name: Publish dart_ipfs (Umbrella)
    needs: [release-gate, publish-quic]
    if: always() && needs.release-gate.result == 'success' && (inputs.target == 'umbrella' || inputs.target == 'all' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Auto-format codebase
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Run pana score check
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        run: dart pub publish -f

  github-release:
    name: GitHub Release
    needs: [publish-umbrella]
    if: always() && needs.publish-umbrella.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::no CHANGELOG section for [$VERSION]"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --latest \
            --verify-tag
