name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "core-v[0-9]+.[0-9]+.[0-9]+*"
      - "quic-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: 'Target package to publish (core, quic, umbrella, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - quic
          - umbrella
      dry_run:
        description: 'Dry run only (do not actually publish)'
        required: false
        default: false
        type: boolean

jobs:
  release-gate:
    name: Release surface gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Verify release surfaces and tag
        run: |
          TAG_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_ARG="--tag ${GITHUB_REF#refs/tags/}"
          fi
          dart run tool/release_surfaces.dart --check $TAG_ARG

  quality-gate:
    name: Quality gate (analyze + test + coverage)
    needs: [release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Determine publish targets
        id: targets
        run: |
          REF="${GITHUB_REF}"
          TARGET="${{ inputs.target }}"
          CORE=false; QUIC=false; UMBRELLA=false
          case "$REF" in
            refs/tags/v*) CORE=true; QUIC=true; UMBRELLA=true ;;
            refs/tags/core-v*) CORE=true ;;
            refs/tags/quic-v*) QUIC=true ;;
          esac
          case "$TARGET" in
            all) CORE=true; QUIC=true; UMBRELLA=true ;;
            core) CORE=true ;;
            quic) QUIC=true ;;
            umbrella) UMBRELLA=true ;;
          esac
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "quic=$QUIC" >> "$GITHUB_OUTPUT"
          echo "umbrella=$UMBRELLA" >> "$GITHUB_OUTPUT"
          echo "Publish targets: core=$CORE quic=$QUIC umbrella=$UMBRELLA"

      - name: Resolve coverage base ref
        id: base
        run: |
          git fetch origin '+refs/tags/v*:refs/tags/v*' || true
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD^)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Coverage base ref: $BASE"

      - name: Install dependencies (umbrella)
        if: steps.targets.outputs.umbrella == 'true'
        run: dart pub get

      - name: Analyze umbrella
        if: steps.targets.outputs.umbrella == 'true'
        run: dart analyze --fatal-warnings

      - name: Test umbrella (with coverage)
        if: steps.targets.outputs.umbrella == 'true'
        run: dart test --coverage=coverage --reporter=expanded

      - name: Changed-line coverage gate (umbrella)
        if: steps.targets.outputs.umbrella == 'true'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json --report-on=lib
          dart run tool/changed_line_coverage.dart \
            --base="${{ steps.base.outputs.base }}" --lcov=coverage/lcov.info

      - name: Install dependencies (core)
        if: steps.targets.outputs.core == 'true'
        working-directory: packages/dart_ipfs_core
        run: dart pub get

      - name: Analyze + test core (with coverage)
        if: steps.targets.outputs.core == 'true'
        working-directory: packages/dart_ipfs_core
        run: |
          dart analyze --fatal-warnings
          dart test --coverage=coverage --reporter=expanded
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json --report-on=lib

      - name: Changed-line coverage gate (core)
        if: steps.targets.outputs.core == 'true'
        run: |
          dart run tool/changed_line_coverage.dart \
            --base="${{ steps.base.outputs.base }}" \
            --lcov=packages/dart_ipfs_core/coverage/lcov.info \
            --prefix=packages/dart_ipfs_core

      - name: Install dependencies (quic)
        if: steps.targets.outputs.quic == 'true'
        working-directory: packages/dart_ipfs_quic
        run: dart pub get

      - name: Analyze + test quic (with coverage)
        if: steps.targets.outputs.quic == 'true'
        working-directory: packages/dart_ipfs_quic
        run: |
          dart analyze --fatal-warnings
          dart test --coverage=coverage --reporter=expanded
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json --report-on=lib

      - name: Changed-line coverage gate (quic)
        if: steps.targets.outputs.quic == 'true'
        run: |
          dart run tool/changed_line_coverage.dart \
            --base="${{ steps.base.outputs.base }}" \
            --lcov=packages/dart_ipfs_quic/coverage/lcov.info \
            --prefix=packages/dart_ipfs_quic

  publish-core:
    name: Publish dart_ipfs_core
    needs: [release-gate, quality-gate]
    if: inputs.target == 'core' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/core-v') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        working-directory: packages/dart_ipfs_core
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: packages/dart_ipfs_core
        run: dart pub get

      - name: Verify formatting and analysis
        working-directory: packages/dart_ipfs_core
        run: |
          dart format --output=none --set-exit-if-changed . || true
          dart analyze --fatal-warnings

      - name: Run pana score check
        working-directory: packages/dart_ipfs_core
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_core
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_core
        run: dart pub publish -f

  publish-quic:
    name: Publish dart_ipfs_quic
    needs: [release-gate, quality-gate, publish-core]
    if: always() && needs.release-gate.result == 'success' && needs.quality-gate.result == 'success' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && (inputs.target == 'quic' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/quic-v') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        working-directory: packages/dart_ipfs_quic
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: packages/dart_ipfs_quic
        run: dart pub get

      - name: Verify formatting and analysis
        working-directory: packages/dart_ipfs_quic
        run: |
          dart format --output=none --set-exit-if-changed . || true
          dart analyze --fatal-warnings

      - name: Run pana score check
        working-directory: packages/dart_ipfs_quic
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_quic
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        working-directory: packages/dart_ipfs_quic
        run: dart pub publish -f

  publish-umbrella:
    name: Publish dart_ipfs (Umbrella)
    needs: [release-gate, quality-gate, publish-core, publish-quic]
    if: always() && needs.release-gate.result == 'success' && needs.quality-gate.result == 'success' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && (needs.publish-quic.result == 'success' || needs.publish-quic.result == 'skipped') && (inputs.target == 'umbrella' || inputs.target == 'all' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Auto-format codebase
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Analyze umbrella
        run: dart analyze --fatal-warnings

      - name: Run pana score check
        run: |
          dart pub global activate pana
          pana . --no-warning

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        run: dart pub publish -f

  github-release:
    name: GitHub Release
    needs: [publish-umbrella]
    if: always() && needs.publish-umbrella.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::no CHANGELOG section for [$VERSION]"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --latest \
            --verify-tag
