name: flutter_ipfs
description: Reactive Flutter UI bindings and widgets for dart_ipfs (IpfsScope, IpfsImage, IpfsBuilder, and multi-tier memory caching).
version: 0.1.0
publish_to: 'none'
homepage: https://github.com/jxoesneon/IPFS
repository: https://github.com/jxoesneon/IPFS
issue_tracker: https://github.com/jxoesneon/IPFS/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dart_ipfs:
    path: ../../
  collection: ^1.19.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  dart_ipfs_core:
    path: ../dart_ipfs_core
  dart_ipfs_quic:
    path: ../dart_ipfs_quic

