name: dart_ipfs_quic
description: Native QUIC transport for dart_ipfs backed by the pure-Dart quic_lib package.
version: 0.4.0
homepage: https://github.com/jxoesneon/IPFS
repository: https://github.com/jxoesneon/IPFS
issue_tracker: https://github.com/jxoesneon/IPFS/issues

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  ipfs_libp2p: ^0.6.0
  quic_lib: ^1.13.0

  dart_ipfs_core: ^1.14.0

  collection: ^1.19.1
  meta: ^1.19.0
  logging: ^1.3.0
  uuid: ^4.6.0

dev_dependencies:
  test: ^1.33.0
  lints: ^6.1.0

dependency_overrides:
  ipfs_libp2p:
    path: /data/data/com.termux/files/home/work/ipfs_libp2p
  # Monorepo path override for the unreleased core package.
  dart_ipfs_core:
    path: ../dart_ipfs_core

