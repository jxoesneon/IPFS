name: dart_ipfs
version: 2.0.1
description: A comprehensive IPFS implementation in Dart, supporting CID, Bitswap, UnixFS, and DHT.
homepage: https://github.com/jxoesneon/IPFS
repository: https://github.com/jxoesneon/IPFS
issue_tracker: https://github.com/jxoesneon/IPFS/issues

environment:
  sdk: ^3.13.0

dependencies:
  catalyst_cose: ^1.0.0
  collection: ^1.19.1
  http: ^1.6.0
  fixnum: ^1.1.1
  convert: ^3.1.2
  uuid: ^4.6.0
  web: ^1.1.2

  # Networking and P2P

  # Cryptography
  crypto: ^3.0.7
  pointycastle: ^4.0.0

  # Serialization
  protobuf: ^6.1.0
  async: ^2.13.1

  # Data Storage
  hive: ^2.2.3
  idb_shim: ^2.10.1+1 # IndexedDB for web storage

  # Logging
  logging: ^1.3.0

  # Metrics
  prometheus_client: ^1.0.0+1

  dart_merkle_lib: ^1.0.1
  multibase: ^1.0.0
  dart_multihash: ^1.0.1
  archive: ^4.5.2
  murmurhash: ^1.0.1
  cbor: ^6.5.1
  shelf_router: ^1.1.5
  intl: ^0.20.3
  markdown: ^7.3.1
  synchronized: ^3.5.0
  multicast_dns: ^0.3.3+1
  ipfs_libp2p: ^0.6.0
  cipherlib: ^0.7.2

  jose: ^0.3.5+2
  mime: ^2.1.0
  http_parser: ^4.1.2

  # Core package (hosted)
  dart_ipfs_core: ^1.14.0

  # Optional native QUIC transport adapter (hosted)
  dart_ipfs_quic: ^0.4.0

  # Common packages
  args: ^2.7.0
  yaml: ^3.1.4
  meta: ^1.19.0
  shelf: ^1.4.3
  path: ^1.9.1
  grpc: ^5.2.0
  cryptography: ^2.9.0

  dart_lz4: ^1.4.0
  get_it: ^9.3.0
  base32: ^2.2.0

  # XML parsing for the vendored UPnP/NAT-PCP/NAT-PMP port-forwarding
  # implementation (lib/src/vendor/port_forwarder). Declared directly so
  # consumers resolve the patched 7.x line instead of the 6.x line that the
  # upstream port_forwarder package pins.
  xml: ^7.1.0

dev_dependencies:
  test: ^1.33.0 # For unit and integration tests
  lints: ^6.1.0 # For code style analysis
  coverage: ^1.16.0
  mockito: ^5.8.1
  build_runner: ^2.16.2
  very_good_analysis: ">=10.1.0 <12.0.0"
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

# Assets used in the project, such as images or other static files.
assets:
  - lib/assets/logo.svg

# Example entry point for running the application.
example: main.dart

macos:
  signing:
    enable: false

# Security-critical dependency overrides documented in SECURITY.md.
# These are required during local development and CI because upstream packages
# still allow older, vulnerable releases. Overrides are not visible to package
# consumers, so the published package does not declare these transitive
# dependencies directly. The publish workflow runs with these overrides in
# place and accepts the resulting hints.
#
# `xml` is no longer overridden: it is a direct dependency now (see above),
# because the port-forwarding implementation is vendored into
# lib/src/vendor/port_forwarder and no longer inherits upstream's `xml ^6.5.0`
# constraint.
dependency_overrides:
  # Use local fork of ipfs_libp2p until published
  ipfs_libp2p:
    path: /data/data/com.termux/files/home/work/ipfs_libp2p
  # Monorepo path overrides for unreleased satellite packages
  dart_ipfs_core:
    path: packages/dart_ipfs_core
  dart_ipfs_quic:
    path: packages/dart_ipfs_quic



